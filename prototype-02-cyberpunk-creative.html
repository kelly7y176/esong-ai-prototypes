<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON AI - Cyberpunk Studio</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            neon: {
              cyan: '#00f3ff',
              pink: '#ff0055',
              purple: '#b000ff',
              dark: '#0a0a12',
              card: '#121220'
            }
          }
        }
      }
    }
  </script>
  <!-- Vue 3 via CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #05050a; }
    .neon-border-cyan { box-shadow: 0 0 10px #00f3ff; border-color: #00f3ff; }
    .neon-border-pink { box-shadow: 0 0 10px #ff0055; border-color: #ff0055; }
    .neon-text-cyan { text-shadow: 0 0 8px #00f3ff; color: #00f3ff; }
    .neon-text-pink { text-shadow: 0 0 8px #ff0055; color: #ff0055; }
    [v-cloak] { display: none; }
  </style>
</head>
<body class="bg-neon-dark text-slate-100 min-h-screen flex flex-col font-mono selection:bg-neon-pink selection:text-white">

  <div id="app" v-cloak class="min-h-screen flex flex-col max-w-5xl mx-auto w-full px-4 py-6">
    
    <!-- Cyberpunk Header -->
    <header class="flex items-center justify-between border-b border-cyan-900/50 pb-4 mb-6">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-neon-pink to-neon-purple flex items-center justify-center text-white font-black text-xl shadow-[0_0_15px_#ff0055]">
          ⚡
        </div>
        <div>
          <h1 class="text-xl font-extrabold tracking-wider neon-text-cyan">NEON_GEN.AI</h1>
          <p class="text-[10px] text-cyan-400/70 tracking-widest uppercase">Cyberpunk Interactive Wizard Mode</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs px-3 py-1 rounded-full border border-neon-cyan/50 text-neon-cyan bg-cyan-950/30 neon-border-cyan">
          <i class="fa-solid fa-bolt mr-1"></i> GPU ONLINE
        </span>
      </div>
    </header>

    <!-- Wizard Step Navigation Indicator -->
    <nav aria-label="Wizard Steps" class="grid grid-cols-4 gap-2 mb-8">
      <button v-for="(step, idx) in steps" :key="idx" @click="currentStep = idx + 1" 
              :class="currentStep === idx + 1 ? 'border-neon-cyan bg-cyan-950/50 text-neon-cyan neon-border-cyan' : 'border-slate-800 bg-slate-900/40 text-slate-500'"
              class="p-3 rounded-xl border text-left transition-all duration-300 relative overflow-hidden">
        <div class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Step 0{{ idx + 1 }}</div>
        <div class="text-xs font-bold truncate mt-0.5">{{ step.title }}</div>
      </button>
    </nav>

    <!-- STEP 1: PROMPT WIZARD & STORYBOARD -->
    <main class="flex-1">
      <section v-show="currentStep === 1" class="space-y-6">
        <div class="bg-neon-card border border-cyan-900/40 p-6 rounded-2xl relative shadow-[0_0_20px_rgba(0,243,255,0.05)]">
          <label class="block text-xs font-bold uppercase text-neon-cyan mb-2">Matrix Prompt Synthesizer</label>
          <div class="flex gap-3">
            <input v-model="promptInput" type="text" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-cyan-100 focus:outline-none focus:border-neon-cyan transition-colors" placeholder="Type prompt or use randomize button...">
            <button @click="randomizePrompt" class="px-4 py-3 bg-slate-900 border border-slate-700 hover:border-neon-pink rounded-xl text-slate-300 text-xs font-bold hover:text-neon-pink transition-all">
              🎲 Random
            </button>
            <button @click="generateScenes" :disabled="isGenerating" class="px-6 py-3 bg-gradient-to-r from-neon-pink to-neon-purple hover:opacity-90 rounded-xl text-white font-bold text-xs shadow-[0_0_15px_#ff0055] transition-all">
              <i class="fa-solid" :class="isGenerating ? 'fa-spin fa-spinner' : 'fa-wand-magic-sparkles'"></i> SYNTHESIZE
            </button>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div v-for="(scene, index) in scenes" :key="scene.id" class="bg-neon-card border border-slate-800 rounded-2xl overflow-hidden hover:border-neon-cyan transition-all group">
            <div class="relative aspect-video">
              <img :src="scene.image" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
              <span class="absolute top-2 left-2 bg-black/80 border border-cyan-500/50 text-neon-cyan text-[10px] px-2 py-0.5 rounded-md">
                SEQ_0{{ index + 1 }}
              </span>
            </div>
            <div class="p-4 space-y-2">
              <p class="text-xs text-slate-300 font-medium line-clamp-2">{{ scene.description }}</p>
              <div class="flex items-center justify-between text-[10px] text-slate-500 pt-2 border-t border-slate-800">
                <span>{{ scene.style }}</span>
                <span>{{ scene.duration }} SEC</span>
              </div>
            </div>
          </div>
        </div>

        <div class="flex justify-end pt-4">
          <button @click="currentStep = 2" class="px-6 py-3 bg-neon-cyan text-slate-950 font-black text-xs rounded-xl shadow-[0_0_15px_#00f3ff] hover:bg-cyan-300 transition-all">
            NEXT: TUNE SCENES <i class="fa-solid fa-arrow-right ml-1"></i>
          </button>
        </div>
      </section>

      <!-- STEP 2: SCENE PARAMETER TUNER -->
      <section v-show="currentStep === 2" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="bg-neon-card border border-slate-800 rounded-2xl p-4 space-y-4">
            <div class="aspect-video rounded-xl overflow-hidden border border-neon-cyan/40 relative">
              <img :src="selectedScene.image" class="w-full h-full object-cover">
              <div class="absolute bottom-2 left-2 bg-black/80 px-2 py-1 rounded text-xs text-neon-pink">
                {{ selectedScene.title }}
              </div>
            </div>
            <div class="flex gap-2">
              <button v-for="(sc, i) in scenes" :key="sc.id" @click="selectedSceneIndex = i" 
                      :class="selectedSceneIndex === i ? 'border-neon-cyan text-neon-cyan' : 'border-slate-800 text-slate-500'"
                      class="flex-1 py-2 text-xs font-bold border rounded-lg bg-slate-950">
                Scene {{ i + 1 }}
              </button>
            </div>
          </div>

          <div class="bg-neon-card border border-slate-800 rounded-2xl p-5 space-y-4">
            <h3 class="text-xs font-bold text-neon-cyan uppercase">Render Parameters</h3>
            <div>
              <label class="text-[11px] text-slate-400 block mb-1">Lighting Preset</label>
              <select v-model="selectedScene.mood" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200">
                <option v-for="m in mockData.moods" :key="m" :value="m">{{ m }} Cyber-Glow</option>
              </select>
            </div>
            <div>
              <label class="text-[11px] text-slate-400 block mb-1">Camera Angle</label>
              <select v-model="selectedScene.cameraAngle" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200">
                <option v-for="a in mockData.cameraAngles" :key="a" :value="a">{{ a }}</option>
              </select>
            </div>
            <button @click="regenerateCurrentScene" class="w-full py-3 bg-slate-900 border border-neon-pink text-neon-pink font-bold text-xs rounded-xl hover:bg-neon-pink hover:text-white transition-all">
              <i class="fa-solid fa-arrows-rotate mr-1"></i> RE-RENDER FRAME
            </button>
          </div>
        </div>

        <div class="flex justify-between pt-4">
          <button @click="currentStep = 1" class="px-6 py-3 bg-slate-900 border border-slate-800 text-slate-400 text-xs font-bold rounded-xl">
            BACK
          </button>
          <button @click="currentStep = 3" class="px-6 py-3 bg-neon-cyan text-slate-950 font-black text-xs rounded-xl shadow-[0_0_15px_#00f3ff]">
            NEXT: CHARACTERS <i class="fa-solid fa-arrow-right ml-1"></i>
          </button>
        </div>
      </section>

      <!-- STEP 3: CHARACTER INJECTION -->
      <section v-show="currentStep === 3" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div v-for="char in mockData.characters" :key="char.id" @click="selectedChar = char"
               :class="selectedChar.id === char.id ? 'border-neon-pink neon-border-pink bg-pink-950/20' : 'border-slate-800 bg-neon-card'"
               class="border rounded-2xl p-4 cursor-pointer transition-all space-y-3">
            <img :src="char.avatar" class="w-full h-36 object-cover rounded-xl border border-slate-800">
            <h4 class="font-bold text-sm text-slate-200">{{ char.name }}</h4>
            <p class="text-[11px] text-slate-400">{{ char.outfit }}</p>
          </div>
        </div>

        <div class="flex justify-between pt-4">
          <button @click="currentStep = 2" class="px-6 py-3 bg-slate-900 border border-slate-800 text-slate-400 text-xs font-bold rounded-xl">
            BACK
          </button>
          <button @click="currentStep = 4" class="px-6 py-3 bg-neon-cyan text-slate-950 font-black text-xs rounded-xl shadow-[0_0_15px_#00f3ff]">
            NEXT: PREVIEW & RENDER <i class="fa-solid fa-arrow-right ml-1"></i>
          </button>
        </div>
      </section>

      <!-- STEP 4: VIDEO PREVIEW & EXPORT -->
      <section v-show="currentStep === 4" class="space-y-6">
        <div class="bg-neon-card border border-slate-800 rounded-2xl p-6 text-center space-y-4">
          <div class="aspect-video max-w-2xl mx-auto rounded-xl overflow-hidden border border-neon-cyan/50 relative bg-black">
            <img :src="scenes[activePreviewIndex].image" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-black/40 flex items-center justify-center">
              <button @click="togglePlay" class="w-16 h-16 rounded-full bg-neon-pink text-white flex items-center justify-center text-2xl shadow-[0_0_20px_#ff0055]">
                <i class="fa-solid" :class="isPlaying ? 'fa-pause' : 'fa-play ml-1'"></i>
              </button>
            </div>
          </div>
          <p class="text-xs text-cyan-400 font-mono">SIMULATION PREVIEW MODE - CYBERPUNK 60FPS</p>
        </div>

        <div class="flex justify-between pt-4">
          <button @click="currentStep = 3" class="px-6 py-3 bg-slate-900 border border-slate-800 text-slate-400 text-xs font-bold rounded-xl">
            BACK
          </button>
          <button @click="exportVideo" class="px-8 py-3 bg-gradient-to-r from-neon-pink to-neon-purple text-white font-black text-xs rounded-xl shadow-[0_0_20px_#ff0055]">
            EXPORT CYBER_VIDEO .MP4
          </button>
        </div>
      </section>
    </main>

  </div>

  <script src="mock-data.js"></script>
  <script>
    const { createApp, ref, computed } = Vue;
    createApp({
      setup() {
        const mockData = MOCK_DATA;
        const currentStep = ref(1);
        const steps = [
          { title: "Synthesizer" },
          { title: "Param Tuner" },
          { title: "Cyber Avatar" },
          { title: "Render Matrix" }
        ];
        const promptInput = ref(mockData.samplePrompts[0]);
        const isGenerating = ref(false);
        const scenes = ref([...mockData.scenes]);
        const selectedSceneIndex = ref(0);
        const selectedChar = ref(mockData.characters[0]);
        const isPlaying = ref(false);
        const activePreviewIndex = ref(0);
        let timer = null;

        const selectedScene = computed(() => scenes.value[selectedSceneIndex.value]);

        const randomizePrompt = () => {
          const idx = Math.floor(Math.random() * mockData.samplePrompts.length);
          promptInput.value = mockData.samplePrompts[idx];
        };

        const generateScenes = () => {
          isGenerating.value = true;
          setTimeout(() => {
            scenes.value.forEach(s => s.image = `https://picsum.photos/seed/${Math.random()}/800/450`);
            isGenerating.value = false;
          }, 1000);
        };

        const regenerateCurrentScene = () => {
          selectedScene.value.image = `https://picsum.photos/seed/${Math.random()}/800/450`;
        };

        const togglePlay = () => {
          isPlaying.value = !isPlaying.value;
          if (isPlaying.value) {
            timer = setInterval(() => {
              activePreviewIndex.value = (activePreviewIndex.value + 1) % scenes.value.length;
            }, 1000);
          } else {
            clearInterval(timer);
          }
        };

        const exportVideo = () => {
          alert("[NEON EXPORT] Cyberpunk MP4 render complete!");
        };

        return {
          mockData, currentStep, steps, promptInput, isGenerating, scenes,
          selectedSceneIndex, selectedScene, selectedChar, isPlaying, activePreviewIndex,
          randomizePrompt, generateScenes, regenerateCurrentScene, togglePlay, exportVideo
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
