<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Wizard - AI Short Video</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');
    body { font-family: 'Rajdhani', sans-serif; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    [v-cloak] { display: none; }
    .neon-border { box-shadow: 0 0 10px rgba(0, 243, 255, 0.3); }
    .neon-border-pink { box-shadow: 0 0 10px rgba(255, 0, 85, 0.4); }
  </style>
</head>
<body class="bg-slate-950 text-cyan-400 min-h-screen flex flex-col font-sans antialiased selection:bg-pink-500 selection:text-white">

  <div id="app" v-cloak class="min-h-screen flex flex-col max-w-5xl mx-auto w-full px-3 sm:px-6 py-4">
    
    <!-- Cyberpunk Header -->
    <header class="flex items-center justify-between border-b border-cyan-500/30 pb-4 mb-6 gap-2">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-pink-600 flex items-center justify-center font-black text-white text-lg shadow-[0_0_15px_rgba(236,72,153,0.8)]">
          <i class="fa-solid fa-bolt"></i>
        </div>
        <div>
          <h1 class="font-orbitron font-extrabold text-lg sm:text-2xl text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500 tracking-wider">
            NEON_GEN.AI
          </h1>
          <p class="text-[10px] sm:text-xs text-slate-400 font-mono tracking-widest hidden sm:block">CYBERPUNK INTERACTIVE WIZARD MODE</p>
        </div>
      </div>
      <div class="px-3 py-1 rounded-full border border-cyan-500/50 bg-cyan-950/40 text-[11px] font-mono text-cyan-300 flex items-center gap-2 shrink-0">
        <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
        GPU ONLINE
      </div>
    </header>

    <!-- Wizard Steps Bar (Scrollable on Mobile) -->
    <nav class="flex overflow-x-auto no-scrollbar gap-2 mb-6 pb-2 border-b border-slate-800">
      <button v-for="(stepName, idx) in steps" :key="idx"
              @click="currentStep = idx + 1"
              :class="currentStep === idx + 1 ? 'border-cyan-400 bg-cyan-950/80 text-cyan-300 neon-border' : 'border-slate-800 bg-slate-900/50 text-slate-500'"
              class="flex-1 min-w-[100px] sm:min-w-0 p-2.5 rounded-xl border text-left transition-all shrink-0">
        <span class="text-[9px] font-mono block text-slate-400 uppercase">STEP 0{{ idx + 1 }}</span>
        <span class="text-xs font-orbitron font-bold tracking-wider truncate block">{{ stepName }}</span>
      </button>
    </nav>

    <!-- STEP 1: PROMPT SYNTHESIZER -->
    <main v-if="currentStep === 1" class="space-y-6 flex-1">
      <div class="bg-slate-900/80 border border-cyan-500/30 rounded-2xl p-4 sm:p-6 space-y-4 neon-border">
        <h2 class="text-xs font-orbitron font-bold text-cyan-300 tracking-widest uppercase">Matrix Prompt Synthesizer</h2>
        
        <!-- Adaptive Layout for Synthesize Controls -->
        <div class="flex flex-col sm:flex-row gap-3">
          <input v-model="userPrompt" type="text" class="flex-1 bg-slate-950 border border-cyan-500/40 rounded-xl px-4 py-3 text-xs sm:text-sm text-cyan-100 focus:outline-none focus:border-pink-500 font-mono" placeholder="Synthesize video scene concept...">
          <div class="flex gap-2">
            <button @click="randomizePrompt" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 text-cyan-300 font-mono text-xs rounded-xl border border-slate-700 flex-1 sm:flex-none">
              <i class="fa-solid fa-dice mr-1"></i> Random
            </button>
            <button @click="synthesizeStoryboard" :disabled="isGenerating" class="px-5 py-3 bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-orbitron font-bold text-xs rounded-xl neon-border-pink flex-1 sm:flex-none flex items-center justify-center gap-2">
              <i class="fa-solid" :class="isGenerating ? 'fa-spinner fa-spin' : 'fa-wand-magic-sparkles'"></i>
              <span>SYNTHESIZE</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Generated Matrix Grid -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div v-for="(sc, idx) in scenes" :key="sc.id" class="bg-slate-900/60 border border-slate-800 rounded-2xl overflow-hidden hover:border-cyan-500/50 transition-all flex flex-col">
          <div class="aspect-video relative bg-black">
            <img :src="sc.image" class="w-full h-full object-cover">
            <span class="absolute top-2 left-2 bg-slate-950/80 px-2 py-0.5 rounded text-[10px] font-mono text-cyan-400 border border-cyan-500/30">
              SEQ_0{{ idx + 1 }}
            </span>
          </div>
          <div class="p-3.5 space-y-2 flex-1 flex flex-col justify-between">
            <p class="text-xs text-slate-300 font-mono line-clamp-2">{{ sc.title }}</p>
            <div class="flex items-center justify-between text-[10px] text-slate-500 font-mono pt-2 border-t border-slate-800/80">
              <span>{{ sc.style }}</span>
              <span>{{ sc.duration }} SEC</span>
            </div>
          </div>
        </div>
      </div>

      <div class="flex justify-end pt-4">
        <button @click="currentStep = 2" class="w-full sm:w-auto px-6 py-3 bg-cyan-500 text-slate-950 font-orbitron font-bold text-xs rounded-xl hover:bg-cyan-400 transition-colors">
          NEXT: TUNE SCENES <i class="fa-solid fa-arrow-right ml-1"></i>
        </button>
      </div>
    </main>

    <!-- STEP 2: SCENE TUNER -->
    <main v-if="currentStep === 2" class="space-y-6 flex-1">
      <div class="bg-slate-900/80 border border-cyan-500/30 rounded-2xl p-4 sm:p-6 space-y-4">
        <h2 class="text-xs font-orbitron font-bold text-cyan-300 tracking-widest uppercase">Step 2: Tune Scene Lenses</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="space-y-2">
            <label class="text-xs font-mono text-slate-400">Style Matrix</label>
            <select v-model="activeScene.style" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-cyan-300 font-mono">
              <option v-for="s in mockData.styles" :key="s" :value="s">{{ s }}</option>
            </select>
          </div>
          <div class="space-y-2">
            <label class="text-xs font-mono text-slate-400">Camera Angle</label>
            <select v-model="activeScene.cameraAngle" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-cyan-300 font-mono">
              <option v-for="c in mockData.cameraAngles" :key="c" :value="c">{{ c }}</option>
            </select>
          </div>
        </div>
      </div>
      
      <div class="flex justify-between gap-2">
        <button @click="currentStep = 1" class="px-5 py-3 bg-slate-800 text-slate-300 font-mono text-xs rounded-xl">Back</button>
        <button @click="currentStep = 3" class="px-6 py-3 bg-cyan-500 text-slate-950 font-orbitron font-bold text-xs rounded-xl">NEXT: AVATAR <i class="fa-solid fa-arrow-right ml-1"></i></button>
      </div>
    </main>

    <!-- STEP 3: CYBER AVATAR -->
    <main v-if="currentStep === 3" class="space-y-6 flex-1">
      <div class="bg-slate-900/80 border border-cyan-500/30 rounded-2xl p-4 sm:p-6 space-y-4">
        <h2 class="text-xs font-orbitron font-bold text-cyan-300 tracking-widest uppercase">Step 3: Character Avatar Injection</h2>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div v-for="char in mockData.characters" :key="char.id" @click="selectedChar = char"
               :class="selectedChar.id === char.id ? 'border-pink-500 bg-pink-950/20 neon-border-pink' : 'border-slate-800 bg-slate-950'"
               class="p-3 border rounded-xl flex items-center gap-3 cursor-pointer">
            <img :src="char.avatar" class="w-10 h-10 rounded-lg object-cover">
            <div class="min-w-0">
              <p class="text-xs font-bold text-slate-200 truncate">{{ char.name }}</p>
              <p class="text-[10px] text-slate-500 truncate">{{ char.outfit }}</p>
            </div>
          </div>
        </div>
      </div>

      <div class="flex justify-between gap-2">
        <button @click="currentStep = 2" class="px-5 py-3 bg-slate-800 text-slate-300 font-mono text-xs rounded-xl">Back</button>
        <button @click="currentStep = 4" class="px-6 py-3 bg-cyan-500 text-slate-950 font-orbitron font-bold text-xs rounded-xl">NEXT: RENDER <i class="fa-solid fa-arrow-right ml-1"></i></button>
      </div>
    </main>

    <!-- STEP 4: RENDER MATRIX -->
    <main v-if="currentStep === 4" class="space-y-6 flex-1">
      <div class="bg-slate-900/80 border border-pink-500/40 rounded-2xl p-4 sm:p-6 space-y-4 text-center">
        <h2 class="text-xs font-orbitron font-bold text-pink-400 tracking-widest uppercase">Step 4: Final Video Render Matrix</h2>
        <div class="aspect-video max-w-2xl mx-auto rounded-xl overflow-hidden border border-cyan-500/40 bg-black relative shadow-2xl">
          <img :src="scenes[0].image" class="w-full h-full object-cover">
          <div class="absolute inset-0 flex items-center justify-center bg-black/30">
            <button class="w-14 h-14 rounded-full bg-pink-600 text-white flex items-center justify-center text-xl shadow-lg">
              <i class="fa-solid fa-play ml-1"></i>
            </button>
          </div>
        </div>
        <button @click="exportCyberVideo" class="px-8 py-3.5 bg-gradient-to-r from-pink-600 to-cyan-500 text-white font-orbitron font-extrabold text-xs rounded-xl shadow-xl">
          EXPORT CYBER_VIDEO .MP4
        </button>
      </div>

      <div class="flex justify-start">
        <button @click="currentStep = 3" class="px-5 py-3 bg-slate-800 text-slate-300 font-mono text-xs rounded-xl">Back</button>
      </div>
    </main>

  </div>

  <script src="mock-data.js"></script>
  <script src="ai-service.js"></script>
  <script>
    const { createApp, ref, computed } = Vue;
    createApp({
      setup() {
        const mockData = MOCK_DATA;
        const currentStep = ref(1);
        const steps = ["Synthesize", "Param Tune", "Cyber Avatar", "Render Matrix"];
        const userPrompt = ref("A cyberpunk city at night with neon lights");
        const isGenerating = ref(false);
        const scenes = ref([...mockData.scenes]);
        const selectedChar = ref(mockData.characters[0]);

        const activeScene = computed(() => scenes.value[0]);

        const randomizePrompt = () => {
          const randomIndex = Math.floor(Math.random() * mockData.samplePrompts.length);
          userPrompt.value = mockData.samplePrompts[randomIndex];
        };

        const synthesizeStoryboard = async () => {
          isGenerating.value = true;
          const newImg = await AI_SERVICE.generateImage(userPrompt.value);
          scenes.value.forEach(s => s.image = newImg);
          isGenerating.value = false;
        };

        const exportCyberVideo = () => {
          alert("[CYBER_RENDER] Exporting Cyberpunk MP4 Master...");
        };

        return {
          mockData, currentStep, steps, userPrompt, isGenerating, scenes,
          selectedChar, activeScene, randomizePrompt, synthesizeStoryboard, exportCyberVideo
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
